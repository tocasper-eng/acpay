function init(){

    sl.forEach(function(sys){

function sel(mn,sys){
  cM=mn;cS=sys;
  document.querySelectorAll('.ni').forEach(function(el){el.classList.toggle('a',el.dataset.mn===mn&&el.dataset.sys===sys);});
  document.querySelectorAll('.sh').forEach(function(el){var c=el.querySelector('.sc');if(c&&c.textContent===sys)el.classList.add('o');});
  var tp=document.getElementById('tp');
  var rl=T.filter(function(r){return r.m===mn&&r.s===sys;});
  var tb=new Set();rl.forEach(function(r){tb.add(r.c);tb.add(r.p);});
  tp.innerHTML='<span class="bc">'+sys+'</span><h1>'+mn+' '+(ML[mn]||'')+'</h1><span class="su">'+tb.size+' 張資料表 &middot; '+rl.length+' 條關聯</span>';
  render(mn,sys);
}

function isFK(col,keys){
  if(!keys)return false;
  var ka=keys.split(',').map(function(k){return k.trim();});
  for(var i=0;i<ka.length;i++){
    var k=ka[i];
    if(col.f===k||col.c===k)return true;
    if(col.c.replace(/[A-Z]$/,'')===k)return true;
    if(k.length>=3&&col.f.toLowerCase().indexOf(k.toLowerCase())===0)return true;
    if(col.f.toLowerCase()===k.toLowerCase())return true;
  }
  return false;
}

function gDesc(mn,sys,tn){
  var ac=T.find(function(r){return r.m===mn&&r.s===sys&&r.c===tn;});
  var ap=T.find(function(r){return r.m===mn&&r.s===sys&&r.p===tn;});
  return(ac&&ac.cd)||(ap&&ap.pd)||tn;
}

function gKeys(mn,sys,tn){
  var ks=new Set();
  T.filter(function(r){return r.m===mn&&r.s===sys;}).forEach(function(r){
    if(r.c===tn)r.ck.split(',').forEach(function(k){ks.add(k.trim());});
    if(r.p===tn)r.pk.split(',').forEach(function(k){ks.add(k.trim());});
  });
  return Array.from(ks);
}

function layout(mn,sys){
  var rl=T.filter(function(r){return r.m===mn&&r.s===sys;});
  var iC=new Set(),iP=new Set(),aT=new Set();
  var sn=new Set(),ur=[];
  rl.forEach(function(r){var sg=r.c+'\u2192'+r.p;if(!sn.has(sg)){sn.add(sg);ur.push(r);}});
  ur.forEach(function(r){iC.add(r.c);iP.add(r.p);aT.add(r.c);aT.add(r.p);});
  var pp=Array.from(aT).filter(function(t){return iP.has(t)&&!iC.has(t);});
  var md=Array.from(aT).filter(function(t){return iP.has(t)&&iC.has(t);});
  var pc=Array.from(aT).filter(function(t){return iC.has(t)&&!iP.has(t);});
  var cols=[];if(pp.length)cols.push(pp);if(md.length)cols.push(md);if(pc.length)cols.push(pc);
  if(!cols.length)return{pos:{},rels:ur};
  var pos={},sp=380,sx=50;
  cols.forEach(function(col,ci){var y=30;col.forEach(function(tn){
    var h=gH(tn);
    var role=iP.has(tn)&&!iC.has(tn)?'parent':iC.has(tn)&&!iP.has(tn)?'child':'both';
    pos[tn]={x:sx+ci*sp,y:y,role:role};y+=h+35;
  });});
  return{pos:pos,rels:ur};
}

function gH(tn){var cl=C[tn]||[];return 38+Math.min(cl.length,20)*22+(cl.length>20?24:0)+6;}

function render(mn,sys){
  var cv=document.getElementById('cv');
  document.getElementById('wl').style.display='none';
  cv.querySelectorAll('.cd').forEach(function(e){e.remove();});
  var sg=document.getElementById('sg');sg.innerHTML='';
  var L=layout(mn,sys);cR=L.rels;
  var mx=800,my=600;
  Object.values(L.pos).forEach(function(p){mx=Math.max(mx,p.x+360);my=Math.max(my,p.y+500);});
  cv.style.width=mx+'px';cv.style.height=my+'px';sg.setAttribute('width',mx);sg.setAttribute('height',my);
  var ce={};
  Object.entries(L.pos).forEach(function(e){
    var tn=e[0],p=e[1];
    var cd=mkCard(tn,mn,sys,p);cv.appendChild(cd);ce[tn]=cd;mkDrag(cd,cv,sg);
  });
  cCE=ce;setTimeout(function(){rL();},50);
}

function rSz(){
  var cv=document.getElementById('cv'),sg=document.getElementById('sg');
  var mx=800,my=600;
  cv.querySelectorAll('.cd').forEach(function(cd){mx=Math.max(mx,cd.offsetLeft+cd.offsetWidth+50);my=Math.max(my,cd.offsetTop+cd.offsetHeight+50);});
  cv.style.width=mx+'px';cv.style.height=my+'px';sg.setAttribute('width',mx);sg.setAttribute('height',my);
}

function rL(){var sg=document.getElementById('sg');sg.innerHTML='';cR.forEach(function(r,i){dLine(sg,cCE,r,i);});}

function mkDrag(cd,cv,sg){
  var dr=false,sx,sy,ol,ot;
  cd.addEventListener('mousedown',function(e){if(e.target.closest('.cb')&&e.offsetX>e.target.clientWidth)return;dr=true;cd.classList.add('dr');sx=e.clientX;sy=e.clientY;ol=cd.offsetLeft;ot=cd.offsetTop;e.preventDefault();});
  document.addEventListener('mousemove',function(e){if(!dr)return;cd.style.left=Math.max(0,ol+(e.clientX-sx))+'px';cd.style.top=Math.max(0,ot+(e.clientY-sy))+'px';rL();});
  document.addEventListener('mouseup',function(){if(!dr)return;dr=false;cd.classList.remove('dr');rSz();rL();});
}

function mkCard(tn,mn,sys,pos){
  var cd=document.createElement('div');cd.className='cd';cd.style.left=pos.x+'px';cd.style.top=pos.y+'px';
  var desc=gDesc(mn,sys,tn),keys=gKeys(mn,sys,tn),kj=keys.join(',');
  var hc=pos.role==='parent'?PC:pos.role==='child'?CC:MC;
  var rn=pos.role==='parent'?'主檔':pos.role==='child'?'明細':'中間';
  var cl=C[tn]||[],MX=20;
  var h='<div class="ch" style="background:'+hc+'"><span class="tn">'+tn+'</span><span class="td">'+desc+'</span><span class="rb">'+rn+'</span></div><div class="cb">';
  cl.slice(0,MX).forEach(function(col){var fk=isFK(col,kj);h+='<div class="cr'+(fk?' fk':'')+'"><span class="ci">'+(fk?'&#128273;':'')+'</span><span class="cf">'+col.f+'</span><span class="cc">'+col.c+'</span></div>';});
  h+='</div>';
  if(cl.length>MX)h+='<div class="ft">... 還有 '+(cl.length-MX)+' 個欄位</div>';
  if(!cl.length)h+='<div class="ft" style="color:#dc2626">尚無欄位定義</div>';
  cd.innerHTML=h;return cd;
}

function dLine(sg,ce,rel,idx){
  var cc=ce[rel.c],pc=ce[rel.p];if(!cc||!pc)return;
  var cL=cc.offsetLeft,cT=cc.offsetTop,cW=cc.offsetWidth,pL=pc.offsetLeft,pT=pc.offsetTop,pW=pc.offsetWidth;
  var ccx=cL+cW/2,pcx=pL+pW/2,x1,y1,x2,y2,off=idx*12;
  if(ccx>pcx){x1=cL;y1=cT+38+off;x2=pL+pW;y2=pT+38+off;}
  else{x1=cL+cW;y1=cT+38+off;x2=pL;y2=pT+38+off;}
  var co=LC[idx%LC.length],mx=(x1+x2)/2;
  var p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d','M '+x1+' '+y1+' C '+mx+' '+y1+', '+mx+' '+y2+', '+x2+' '+y2);
  p.setAttribute('class','rl');p.setAttribute('stroke',co);
  var cs=10,cd=ccx>pcx?-1:1;
  var cf=document.createElementNS('http://www.w3.org/2000/svg','g');cf.setAttribute('class','cff');cf.setAttribute('stroke',co);
  ['M '+x1+' '+y1+' L '+(x1+cd*cs)+' '+(y1-cs),'M '+x1+' '+y1+' L '+(x1+cd*cs)+' '+y1,'M '+x1+' '+y1+' L '+(x1+cd*cs)+' '+(y1+cs)].forEach(function(d){
    var l=document.createElementNS('http://www.w3.org/2000/svg','path');l.setAttribute('d',d);l.setAttribute('stroke',co);l.setAttribute('stroke-width','2');l.setAttribute('fill','none');cf.appendChild(l);
  });
  var ci=document.createElementNS('http://www.w3.org/2000/svg','circle');ci.setAttribute('cx',x2);ci.setAttribute('cy',y2);ci.setAttribute('r',4);ci.setAttribute('fill','#fff');ci.setAttribute('stroke',co);ci.setAttribute('stroke-width',2);
  var lx=mx,ly=(y1+y2)/2-8;
