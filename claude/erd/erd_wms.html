const PARENT_COLOR = '#2563eb';
const CHILD_COLOR  = '#059669';
const MIDDLE_COLOR = '#7c3aed';
const LINE_COLORS = ['#6366f1','#2563eb','#0891b2','#059669','#d97706','#dc2626','#7c3aed','#be185d'];

/* ================================================================
   RENDERING LOGIC
   ================================================================ */
let currentMenu = null;
let currentSys = null;
let currentCardElements = {};
let currentRels = [];

function init() {
  const navList = document.getElementById('navList');

  // Build 3-level navigation: dbname -> systno -> menunum
  const dbGroups = {};
  TBLDEF.forEach(r => {
    if (!dbGroups[r.db]) dbGroups[r.db] = {};
    if (!dbGroups[r.db][r.sys]) dbGroups[r.db][r.sys] = new Set();
    dbGroups[r.db][r.sys].add(r.mn);
  });

  Object.keys(dbGroups).forEach(db => {
    const dbHeader = document.createElement('div');
    dbHeader.className = 'db-header';
    dbHeader.textContent = db;
    navList.appendChild(dbHeader);

    const sysList = Object.keys(dbGroups[db]).sort((a,b) => {
      const ia = SYS_ORDER.indexOf(a), ib = SYS_ORDER.indexOf(b);
      return (ia===-1?99:ia) - (ib===-1?99:ib);
    });

    sysList.forEach(sys => {
      const menus = [...dbGroups[db][sys]].sort();
      const group = document.createElement('div');
      group.className = 'sys-group';

      const sysHeader = document.createElement('div');
      sysHeader.className = 'sys-header';
      sysHeader.innerHTML = '<span class="sys-arrow">&#9654;</span><span class="sys-code">' + sys + '</span><span class="sys-label">' + (SYS_LABELS[sys]||sys) + '</span><span class="sys-badge">' + menus.length + '</span>';
      sysHeader.onclick = function() { sysHeader.classList.toggle('open'); };
      group.appendChild(sysHeader);

      const items = document.createElement('div');
      items.className = 'sys-items';
      menus.forEach(mn => {
        const rels = TBLDEF.filter(r => r.mn === mn && r.sys === sys);
        const tables = new Set();
        rels.forEach(r => { tables.add(r.child); tables.add(r.parent); });
        const div = document.createElement('div');
        div.className = 'nav-item';
        div.dataset.mn = mn;
        div.dataset.sys = sys;
        div.innerHTML = '<span class="nav-code">' + mn + '</span><span class="nav-label">' + (MENU_LABELS[mn]||mn) + '</span><span class="nav-badge">' + tables.size + '</span>';
        div.onclick = function() { selectMenu(mn, sys); };
        items.appendChild(div);
      });
      group.appendChild(items);
      navList.appendChild(group);
    });
  });

  // Auto-open first system group and select first menu
  const firstSysHeader = navList.querySelector('.sys-header');
  if (firstSysHeader) {
    firstSysHeader.classList.add('open');
    const firstItem = navList.querySelector('.nav-item');
    if (firstItem) selectMenu(firstItem.dataset.mn, firstItem.dataset.sys);
  }
}

function selectMenu(mn, sys) {
  currentMenu = mn;
  currentSys = sys;

  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.mn === mn && el.dataset.sys === sys);
  });
  // Auto-open parent sys-group
  document.querySelectorAll('.sys-header').forEach(el => {
    const code = el.querySelector('.sys-code');
    if (code && code.textContent === sys) el.classList.add('open');
  });

  const topbar = document.getElementById('topbar');
  const rels = TBLDEF.filter(r => r.mn === mn && r.sys === sys);
  const tables = new Set();
  rels.forEach(r => { tables.add(r.child); tables.add(r.parent); });
  topbar.innerHTML = '<span class="breadcrumb">' + sys + '</span><h1>' + mn + ' ' + (MENU_LABELS[mn]||'') + '</h1><span class="sub">' + tables.size + ' 張資料表 &middot; ' + rels.length + ' 條關聯</span>';

  renderERD(mn, sys);
}

function isKeyCol(col, keys) {
  if (!keys) return false;
  var keyArr = keys.split(',').map(function(k){ return k.trim(); });
  for (var i = 0; i < keyArr.length; i++) {
    var key = keyArr[i];
    if (col.f === key) return true;
    if (col.c === key) return true;
    if (col.c.replace(/[A-Z]$/, '') === key) return true;
    if (key.length >= 3 && col.f.toLowerCase().indexOf(key.toLowerCase()) === 0) return true;
    if (col.f.toLowerCase() === key.toLowerCase()) return true;
  }
  return false;
}

function getTableDesc(mn, sys, tableName) {
  var asChild = TBLDEF.find(function(r){ return r.mn === mn && r.sys === sys && r.child === tableName; });
  var asParent = TBLDEF.find(function(r){ return r.mn === mn && r.sys === sys && r.parent === tableName; });
  return (asChild && asChild.cdesc) || (asParent && asParent.pdesc) || tableName;
}

function getTableKeys(mn, sys, tableName) {
  var keys = new Set();
  TBLDEF.filter(function(r){ return r.mn === mn && r.sys === sys; }).forEach(function(r) {
    if (r.child === tableName) r.ckeys.split(',').forEach(function(k){ keys.add(k.trim()); });
    if (r.parent === tableName) r.pkeys.split(',').forEach(function(k){ keys.add(k.trim()); });
  });
  return Array.from(keys);
}

function computeLayout(mn, sys) {
  var rels = TBLDEF.filter(function(r){ return r.mn === mn && r.sys === sys; });
  var isChild = new Set(), isParent = new Set();
  var allTables = new Set();

  var seen = new Set();
  var uniqueRels = [];
  rels.forEach(function(r) {
    var sig = r.child + '\u2192' + r.parent;
    if (!seen.has(sig)) { seen.add(sig); uniqueRels.push(r); }
  });

  uniqueRels.forEach(function(r) {
    isChild.add(r.child);
    isParent.add(r.parent);
    allTables.add(r.child);
    allTables.add(r.parent);
  });

  var pureParents = Array.from(allTables).filter(function(t){ return isParent.has(t) && !isChild.has(t); });
  var middle = Array.from(allTables).filter(function(t){ return isParent.has(t) && isChild.has(t); });
  var pureChildren = Array.from(allTables).filter(function(t){ return isChild.has(t) && !isParent.has(t); });

  var columns = [];
  if (pureParents.length) columns.push(pureParents);
  if (middle.length) columns.push(middle);
  if (pureChildren.length) columns.push(pureChildren);

  if (columns.length === 0) return { positions: {}, rels: uniqueRels };

  var positions = {};
  var colSpacing = 400;
  var startX = 60;

  columns.forEach(function(col, ci) {
    var y = 40;
    col.forEach(function(tableName, ti) {
      var h = getCardHeight(tableName, mn, sys);
      var role = (isParent.has(tableName) && !isChild.has(tableName)) ? 'parent' :
                 (isChild.has(tableName) && !isParent.has(tableName)) ? 'child' : 'both';
      positions[tableName] = { x: startX + ci * colSpacing, y: y, role: role };
      y += h + 40;
    });
  });

  return { positions: positions, rels: uniqueRels };
}

function getCardHeight(tableName, mn, sys) {
  var cols = COLDEF[tableName] || [];
  var MAX = 22;
  var visible = Math.min(cols.length, MAX);
  return 42 + visible * 24 + (cols.length > MAX ? 28 : 0) + 8;
}

function renderERD(mn, sys) {
  var canvas = document.getElementById('canvas');
  var welcome = document.getElementById('welcome');
  welcome.style.display = 'none';

  canvas.querySelectorAll('.card').forEach(function(el){ el.remove(); });
  var svg = document.getElementById('svgLayer');
  svg.innerHTML = '';

  var layout = computeLayout(mn, sys);
  var positions = layout.positions;
  currentRels = layout.rels;

  var maxX = 800, maxY = 600;
  Object.values(positions).forEach(function(p) {
    maxX = Math.max(maxX, p.x + 380);
    maxY = Math.max(maxY, p.y + 600);
  });
  canvas.style.width = maxX + 'px';
  canvas.style.height = maxY + 'px';
  svg.setAttribute('width', maxX);
  svg.setAttribute('height', maxY);

  var cardElements = {};
  Object.entries(positions).forEach(function(entry) {
    var tableName = entry[0], pos = entry[1];
    var card = createCard(tableName, mn, sys, pos);
    canvas.appendChild(card);
    cardElements[tableName] = card;
    makeDraggable(card, canvas, svg);
  });
  currentCardElements = cardElements;

  setTimeout(function(){ redrawLines(); }, 50);
}

function resizeCanvas() {
  var canvas = document.getElementById('canvas');
  var svg = document.getElementById('svgLayer');
  var maxX = 800, maxY = 600;
  canvas.querySelectorAll('.card').forEach(function(card) {
    maxX = Math.max(maxX, card.offsetLeft + card.offsetWidth + 60);
    maxY = Math.max(maxY, card.offsetTop + card.offsetHeight + 60);
  });
  canvas.style.width = maxX + 'px';
  canvas.style.height = maxY + 'px';
  svg.setAttribute('width', maxX);
  svg.setAttribute('height', maxY);
}

function redrawLines() {
  var svg = document.getElementById('svgLayer');
  svg.innerHTML = '';
  currentRels.forEach(function(r, idx) {
    drawRelLine(svg, currentCardElements, r, idx);
  });
}

function makeDraggable(card, canvas, svg) {
  var isDragging = false, startX, startY, origLeft, origTop;

  card.addEventListener('mousedown', function(e) {
    if (e.target.closest('.card-body') && e.offsetX > e.target.clientWidth) return;
    isDragging = true;
    card.classList.add('dragging');
    startX = e.clientX;
    startY = e.clientY;
    origLeft = card.offsetLeft;
    origTop = card.offsetTop;
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;
    card.style.left = Math.max(0, origLeft + dx) + 'px';
    card.style.top = Math.max(0, origTop + dy) + 'px';
    redrawLines();
  });

  document.addEventListener('mouseup', function() {
    if (!isDragging) return;
    isDragging = false;
    card.classList.remove('dragging');
    resizeCanvas();
    redrawLines();
  });
}

function createCard(tableName, mn, sys, pos) {
  var card = document.createElement('div');
  card.className = 'card';
  card.style.left = pos.x + 'px';
  card.style.top = pos.y + 'px';
  card.id = 'card-' + tableName.replace(/[^a-zA-Z0-9_]/g, '_');

  var desc = getTableDesc(mn, sys, tableName);
  var keys = getTableKeys(mn, sys, tableName);
  var keyJoin = keys.join(',');

  var headerColor = pos.role === 'parent' ? PARENT_COLOR :
                    pos.role === 'child' ? CHILD_COLOR : MIDDLE_COLOR;
  var roleName = pos.role === 'parent' ? '主檔' :
                 pos.role === 'child' ? '明細' : '中間';

  var cols = COLDEF[tableName] || [];
  var MAX = 22;

  var html = '<div class="card-header" style="background:' + headerColor + '">' +
    '<span class="tbl-name">' + tableName + '</span>' +
    '<span class="tbl-desc">' + desc + '</span>' +
    '<span class="role-badge">' + roleName + '</span>' +
    '</div><div class="card-body">';

  var shown = cols.slice(0, MAX);
  shown.forEach(function(col) {
    var isFk = isKeyCol(col, keyJoin);
    html += '<div class="col-row' + (isFk ? ' fk-row' : '') + '">' +
      '<span class="col-icon">' + (isFk ? '&#128273;' : '') + '</span>' +
      '<span class="col-field">' + col.f + '</span>' +
      '<span class="col-caption">' + col.c + '</span>' +
      '</div>';
  });

  html += '</div>';
  if (cols.length > MAX) {
    html += '<div class="card-footer">... 還有 ' + (cols.length - MAX) + ' 個欄位</div>';
  }
  if (cols.length === 0) {
    html += '<div class="card-footer" style="color:#dc2626">尚無欄位定義</div>';
  }

  card.innerHTML = html;
  return card;
}

function drawRelLine(svg, cardElements, rel, idx) {
  var childCard = cardElements[rel.child];
  var parentCard = cardElements[rel.parent];
  if (!childCard || !parentCard) return;

  var cL = childCard.offsetLeft, cT = childCard.offsetTop;
  var cW = childCard.offsetWidth, cH = childCard.offsetHeight;
  var pL = parentCard.offsetLeft, pT = parentCard.offsetTop;
  var pW = parentCard.offsetWidth, pH = parentCard.offsetHeight;

  var childCenterX = cL + cW / 2;
  var parentCenterX = pL + pW / 2;

  var x1, y1, x2, y2;
  var offset = idx * 12;

  if (childCenterX > parentCenterX) {
    x1 = cL; y1 = cT + 42 + offset;
    x2 = pL + pW; y2 = pT + 42 + offset;
  } else {
    x1 = cL + cW; y1 = cT + 42 + offset;
    x2 = pL; y2 = pT + 42 + offset;
  }

  var color = LINE_COLORS[idx % LINE_COLORS.length];
  var midX = (x1 + x2) / 2;

  var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' C ' + midX + ' ' + y1 + ', ' + midX + ' ' + y2 + ', ' + x2 + ' ' + y2);
  path.setAttribute('class', 'rel-line');
  path.setAttribute('stroke', color);
  path.setAttribute('data-child', rel.child);
  path.setAttribute('data-parent', rel.parent);

  var cfSize = 10;
  var cfDir = childCenterX > parentCenterX ? -1 : 1;
  var cf = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  cf.setAttribute('class', 'crow-foot');
  cf.setAttribute('stroke', color);
  var lines = [
    'M ' + x1 + ' ' + y1 + ' L ' + (x1 + cfDir*cfSize) + ' ' + (y1 - cfSize),
    'M ' + x1 + ' ' + y1 + ' L ' + (x1 + cfDir*cfSize) + ' ' + y1,
    'M ' + x1 + ' ' + y1 + ' L ' + (x1 + cfDir*cfSize) + ' ' + (y1 + cfSize)
  ];
  lines.forEach(function(d) {
    var l = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    l.setAttribute('d', d);
    l.setAttribute('stroke', color);
    l.setAttribute('stroke-width', '2');
    l.setAttribute('fill', 'none');
    cf.appendChild(l);
  });

  var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('cx', x2);
  circle.setAttribute('cy', y2);
  circle.setAttribute('r', 4);
  circle.setAttribute('fill', '#fff');
  circle.setAttribute('stroke', color);
  circle.setAttribute('stroke-width', 2);

  var labelX = midX;
  var labelY = (y1 + y2) / 2 - 8;
  var label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  label.setAttribute('x', labelX);
  label.setAttribute('y', labelY);
  label.setAttribute('text-anchor', 'middle');
  label.setAttribute('fill', color);
  label.setAttribute('class', 'rel-label');
  label.textContent = rel.ckeys;

  var bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');

  svg.appendChild(path);
  svg.appendChild(cf);
  svg.appendChild(circle);
  svg.appendChild(label);

  setTimeout(function() {
    var bbox = label.getBBox();
    if (bbox.width > 0) {
      bg.setAttribute('x', bbox.x - 4);
      bg.setAttribute('y', bbox.y - 2);
      bg.setAttribute('width', bbox.width + 8);
      bg.setAttribute('height', bbox.height + 4);
      bg.setAttribute('rx', 3);
      bg.setAttribute('fill', 'rgba(255,255,255,.85)');
      svg.insertBefore(bg, label);
    }
  }, 10);

  path.addEventListener('mouseenter', function() {
    path.setAttribute('stroke-width', '3.5');
    if (childCard) childCard.style.boxShadow = '0 0 0 3px ' + color + ', 0 4px 16px rgba(0,0,0,.2)';
    if (parentCard) parentCard.style.boxShadow = '0 0 0 3px ' + color + ', 0 4px 16px rgba(0,0,0,.2)';
  });
  path.addEventListener('mouseleave', function() {
    path.setAttribute('stroke-width', '2');
    if (childCard) childCard.style.boxShadow = '';
    if (parentCard) parentCard.style.boxShadow = '';
  });
}

init();
</script>
