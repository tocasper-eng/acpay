/* ================================================================
   DATA — Color palette for parent/child cards
   ================================================================ */
const PARENT_COLOR = '#2563eb';
const CHILD_COLOR  = '#059669';
const MIDDLE_COLOR = '#7c3aed';
const LINE_COLORS = ['#6366f1','#2563eb','#0891b2','#059669','#d97706','#dc2626','#7c3aed','#be185d'];

/* ================================================================
   RENDERING LOGIC
   ================================================================ */
let currentMenu = null;

function init() {
  // Build sidebar navigation
  const navList = document.getElementById('navList');
  MENU_ORDER.forEach(mn => {
    const rels = TBLDEF.filter(r => r.mn === mn);
    const tables = new Set();
    rels.forEach(r => { tables.add(r.child); tables.add(r.parent); });
    const div = document.createElement('div');
    div.className = 'nav-item';
    div.dataset.mn = mn;
    div.innerHTML = `<span class="nav-code">${mn}</span><span class="nav-label">${MENU_LABELS[mn]||mn}</span><span class="nav-badge">${tables.size}</span>`;
    div.onclick = () => selectMenu(mn);
    navList.appendChild(div);
  });
  // Auto-select first menu
  selectMenu(MENU_ORDER[0]);
}

function selectMenu(mn) {
  currentMenu = mn;
  // Update nav active state
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.mn === mn);
  });
  // Update topbar
  const topbar = document.getElementById('topbar');
  const rels = TBLDEF.filter(r => r.mn === mn);
  const tables = new Set();
  rels.forEach(r => { tables.add(r.child); tables.add(r.parent); });
  topbar.innerHTML = `<h1>${mn} ${MENU_LABELS[mn]||''}</h1><span class="sub">${tables.size} 張資料表 · ${rels.length} 條關聯</span>`;
  // Render ERD
  renderERD(mn);
}

function isKeyCol(col, keys) {
  if (!keys) return false;
  const keyArr = keys.split(',').map(k => k.trim());
  for (const key of keyArr) {
    if (col.f === key) return true;
    if (col.c === key) return true;
    // Handle captions with trailing suffix like 契約編號F → 契約編號
    if (col.c.replace(/[A-Z]$/, '') === key) return true;
  }
  return false;
}

function getTableDesc(mn, tableName) {
  // Get description from TBLDEF for this menunum context
  const asChild = TBLDEF.find(r => r.mn === mn && r.child === tableName);
  const asParent = TBLDEF.find(r => r.mn === mn && r.parent === tableName);
  return (asChild && asChild.cdesc) || (asParent && asParent.pdesc) || tableName;
}

function getTableKeys(mn, tableName) {
  // Collect all FK keys for this table in this menunum
  const keys = new Set();
  TBLDEF.filter(r => r.mn === mn).forEach(r => {
    if (r.child === tableName) r.ckeys.split(',').forEach(k => keys.add(k.trim()));
    if (r.parent === tableName) r.pkeys.split(',').forEach(k => keys.add(k.trim()));
  });
  return [...keys];
}

function computeLayout(mn) {
  const rels = TBLDEF.filter(r => r.mn === mn);
  const isChild = new Set(), isParent = new Set();
  const allTables = new Set();

  // Deduplicate: same child→parent pair in same menunum (A01 has eep_iwd_10→eep_iwh twice)
  const seen = new Set();
  const uniqueRels = [];
  rels.forEach(r => {
    const sig = r.child + '→' + r.parent;
    if (!seen.has(sig)) {
      seen.add(sig);
      uniqueRels.push(r);
    }
  });

  uniqueRels.forEach(r => {
    isChild.add(r.child);
    isParent.add(r.parent);
    allTables.add(r.child);
    allTables.add(r.parent);
  });

  const pureParents = [...allTables].filter(t => isParent.has(t) && !isChild.has(t));
  const middle = [...allTables].filter(t => isParent.has(t) && isChild.has(t));
  const pureChildren = [...allTables].filter(t => isChild.has(t) && !isParent.has(t));

  const columns = [];
  if (pureParents.length) columns.push(pureParents);
  if (middle.length) columns.push(middle);
  if (pureChildren.length) columns.push(pureChildren);

  // If there's only 1 column (shouldn't happen with rels), center it
  if (columns.length === 0) return { positions: {}, rels: uniqueRels };

  const positions = {};
  const colSpacing = 400;
  const startX = 60;

  columns.forEach((col, ci) => {
    // Compute card heights first to distribute vertically
    const heights = col.map(t => getCardHeight(t, mn));
    const totalH = heights.reduce((a, b) => a + b, 0) + (col.length - 1) * 40;
    let y = 40;

    col.forEach((tableName, ti) => {
      const role = (isParent.has(tableName) && !isChild.has(tableName)) ? 'parent' :
                   (isChild.has(tableName) && !isParent.has(tableName)) ? 'child' : 'both';
      positions[tableName] = { x: startX + ci * colSpacing, y, role };
      y += heights[ti] + 40;
    });
  });

  return { positions, rels: uniqueRels };
}

function getCardHeight(tableName, mn) {
  const cols = COLDEF[tableName] || [];
  const keys = getTableKeys(mn, tableName);
  // Filter: show key columns first, then others, max 22
  const MAX = 22;
  const visible = Math.min(cols.length, MAX);
  return 42 + visible * 24 + (cols.length > MAX ? 28 : 0) + 8;
}

function renderERD(mn) {
  const canvas = document.getElementById('canvas');
  const welcome = document.getElementById('welcome');
  welcome.style.display = 'none';

  // Clear existing cards and SVG
  canvas.querySelectorAll('.card').forEach(el => el.remove());
  const svg = document.getElementById('svgLayer');
  svg.innerHTML = '';

  const { positions, rels } = computeLayout(mn);

  // Determine canvas size
  let maxX = 800, maxY = 600;
  Object.values(positions).forEach(p => {
    maxX = Math.max(maxX, p.x + 380);
    maxY = Math.max(maxY, p.y + 600);
  });
  canvas.style.width = maxX + 'px';
  canvas.style.height = maxY + 'px';
  svg.setAttribute('width', maxX);
  svg.setAttribute('height', maxY);

  // Render cards
  const cardElements = {};
  Object.entries(positions).forEach(([tableName, pos]) => {
    const card = createCard(tableName, mn, pos);
    canvas.appendChild(card);
    cardElements[tableName] = card;
  });

  // Render relationship lines
  setTimeout(() => {
    rels.forEach((r, idx) => {
      drawRelLine(svg, cardElements, r, idx);
    });
  }, 50);
}

function createCard(tableName, mn, pos) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.left = pos.x + 'px';
  card.style.top = pos.y + 'px';
  card.id = 'card-' + tableName.replace(/[^a-zA-Z0-9_]/g, '_');

  const desc = getTableDesc(mn, tableName);
  const keys = getTableKeys(mn, tableName);
  const keyJoin = keys.join(',');

  const headerColor = pos.role === 'parent' ? PARENT_COLOR :
                      pos.role === 'child' ? CHILD_COLOR : MIDDLE_COLOR;
  const roleName = pos.role === 'parent' ? '主檔' :
                   pos.role === 'child' ? '明細' : '中間';

  // Build columns
  const cols = COLDEF[tableName] || [];
  const MAX = 22;

  let html = `<div class="card-header" style="background:${headerColor}">
    <span class="tbl-name">${tableName}</span>
    <span class="tbl-desc">${desc}</span>
    <span class="role-badge">${roleName}</span>
  </div><div class="card-body">`;

  const shown = cols.slice(0, MAX);
  shown.forEach(col => {
    const isFk = isKeyCol(col, keyJoin);
    html += `<div class="col-row${isFk ? ' fk-row' : ''}">
      <span class="col-icon">${isFk ? '🔑' : ''}</span>
      <span class="col-field">${col.f}</span>
      <span class="col-caption">${col.c}</span>
    </div>`;
  });

  html += '</div>';
  if (cols.length > MAX) {
    html += `<div class="card-footer">... 還有 ${cols.length - MAX} 個欄位</div>`;
  }

  card.innerHTML = html;
  return card;
}

function drawRelLine(svg, cardElements, rel, idx) {
  const childCard = cardElements[rel.child];
  const parentCard = cardElements[rel.parent];
  if (!childCard || !parentCard) return;

  const cRect = childCard.getBoundingClientRect();
  const pRect = parentCard.getBoundingClientRect();
  const svgRect = svg.getBoundingClientRect();

  // Check relative positions to determine connection sides
  const childCenterX = cRect.left + cRect.width / 2;
  const parentCenterX = pRect.left + pRect.width / 2;

  let x1, y1, x2, y2;
  const offset = idx * 12; // Offset for multiple lines from same card

  if (childCenterX > parentCenterX) {
    // Child is to the right of parent
    x1 = cRect.left - svgRect.left;
    y1 = cRect.top - svgRect.top + 42 + offset;
    x2 = pRect.right - svgRect.left;
    y2 = pRect.top - svgRect.top + 42 + offset;
  } else {
    // Child is to the left of parent
    x1 = cRect.right - svgRect.left;
    y1 = cRect.top - svgRect.top + 42 + offset;
    x2 = pRect.left - svgRect.left;
    y2 = pRect.top - svgRect.top + 42 + offset;
  }

  const color = LINE_COLORS[idx % LINE_COLORS.length];
  const midX = (x1 + x2) / 2;

  // Bezier curve
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`);
  path.setAttribute('class', 'rel-line');
  path.setAttribute('stroke', color);
  path.setAttribute('data-child', rel.child);
  path.setAttribute('data-parent', rel.parent);

  // Crow's foot at child end (many side)
  const cfSize = 10;
  const cfDir = childCenterX > parentCenterX ? -1 : 1;
  const cf = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  cf.setAttribute('class', 'crow-foot');
  cf.setAttribute('stroke', color);
  // Three lines forming crow's foot
  const lines = [
    `M ${x1} ${y1} L ${x1 + cfDir*cfSize} ${y1 - cfSize}`,
    `M ${x1} ${y1} L ${x1 + cfDir*cfSize} ${y1}`,
    `M ${x1} ${y1} L ${x1 + cfDir*cfSize} ${y1 + cfSize}`
  ];
  lines.forEach(d => {
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    l.setAttribute('d', d);
    l.setAttribute('stroke', color);
    l.setAttribute('stroke-width', '2');
    l.setAttribute('fill', 'none');
    cf.appendChild(l);
  });

  // One-side indicator at parent end (circle)
  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('cx', x2);
  circle.setAttribute('cy', y2);
  circle.setAttribute('r', 4);
  circle.setAttribute('fill', '#fff');
  circle.setAttribute('stroke', color);
  circle.setAttribute('stroke-width', 2);

  // Label
  const labelX = midX;
  const labelY = (y1 + y2) / 2 - 8;
  const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  label.setAttribute('x', labelX);
  label.setAttribute('y', labelY);
  label.setAttribute('text-anchor', 'middle');
  label.setAttribute('fill', color);
  label.setAttribute('class', 'rel-label');
  label.textContent = rel.ckeys;

  // Background rect for label
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');

  svg.appendChild(path);
  svg.appendChild(cf);
  svg.appendChild(circle);
  svg.appendChild(label);

  // After text is rendered, add background
  setTimeout(() => {
    const bbox = label.getBBox();
    if (bbox.width > 0) {
      bg.setAttribute('x', bbox.x - 4);
      bg.setAttribute('y', bbox.y - 2);
      bg.setAttribute('width', bbox.width + 8);
      bg.setAttribute('height', bbox.height + 4);
      bg.setAttribute('rx', 3);
      bg.setAttribute('fill', 'rgba(255,255,255,.85)');
      svg.insertBefore(bg, label);
    }
  }, 10);

  // Hover highlighting
  path.addEventListener('mouseenter', () => {
    path.setAttribute('stroke-width', '3.5');
    if (childCard) childCard.style.boxShadow = `0 0 0 3px ${color}, 0 4px 16px rgba(0,0,0,.2)`;
    if (parentCard) parentCard.style.boxShadow = `0 0 0 3px ${color}, 0 4px 16px rgba(0,0,0,.2)`;
  });
  path.addEventListener('mouseleave', () => {
    path.setAttribute('stroke-width', '2');
    if (childCard) childCard.style.boxShadow = '';
    if (parentCard) parentCard.style.boxShadow = '';
  });
}

// Initialize
init();
